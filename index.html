<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>数字方块 · Number Blocks</title>
  <meta name="description" content="Bilingual number-block math games for kids. 中英双语数学小游戏。">
  <link rel="icon" href="./v2/assets/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Baloo 2", ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(#6bbdf0, #d9f2ff 70%);
      color: #35364a;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 560px; width: 100%; }
    h1 { font-size: clamp(34px, 7vw, 52px); text-shadow: 0 3px 0 rgba(255,255,255,.6); }
    .sub { font-size: clamp(15px, 3vw, 20px); color: #6a6c85; font-weight: 700; margin: 6px 0 30px; }
    .links { display: flex; flex-direction: column; gap: 18px; }
    a.ver {
      display: block;
      padding: 22px 26px;
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      border: 4px solid #5c5cc5;
      box-shadow: 0 6px 18px rgba(38,60,92,.16);
      text-decoration: none;
      color: #35364a;
      transition: transform .15s ease;
    }
    a.ver:hover { transform: translateY(-3px) scale(1.02); }
    a.ver:active { transform: scale(.97); }
    a.ver .t { font-size: clamp(22px, 4.5vw, 30px); font-weight: 800; }
    a.ver .d { font-size: clamp(13px, 2.6vw, 16px); color: #6a6c85; font-weight: 700; margin-top: 4px; }
    a.v2 { border-color: #3db54a; }
    .badge {
      display: inline-block; font-size: 12.5px; font-weight: 800; padding: 3px 12px;
      border-radius: 999px; background: #3db54a; color: #fff; vertical-align: middle;
      margin-left: 8px; letter-spacing: .04em;
    }
    .foot { margin-top: 28px; font-size: 12px; color: rgba(53,54,74,.55); font-weight: 600; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>数字方块<br>Number Blocks</h1>
    <p class="sub">一起玩数学！ · Let's play with numbers!</p>
    <nav class="links">
      <a class="ver v2" href="./v2/">
        <div class="t">🧱 新版 · New<span class="badge">v2</span></div>
        <div class="d">9个游戏 · 双语语音 · 3-10岁 — 9 games, bilingual voice, ages 3-10</div>
      </a>
      <a class="ver" href="./v1/">
        <div class="t">🕹️ 经典版 · Classic<span class="badge" style="background:#5c5cc5">v1</span></div>
        <div class="d">最初的数数和加减法 — the original counting &amp; arithmetic games</div>
      </a>
    </nav>
    <p class="foot">Made with ❤️ for little mathematicians · 为小小数学家制作</p>
  </main>
</body>
</html>
