<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>数字方块 · Number Blocks</title>
  <meta name="description" content="Bilingual Numberblocks-style math games: counting, addition, subtraction, multiplication, division, fractions, decimals & percent. 中英双语数学小游戏。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="数字方块">
  <meta name="theme-color" content="#7ec8f2">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/blocks.css">
  <link rel="stylesheet" href="./css/games.css">
</head>
<body data-lang="both">
  <div id="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="hill hill-1"></div>
    <div class="hill hill-2"></div>
  </div>

  <header id="topbar">
    <button id="btn-home" class="top-btn" aria-label="Home 主页" hidden>🏠</button>
    <div id="page-title" class="page-title"></div>
    <div class="top-actions">
      <button id="btn-audio" class="top-btn" aria-label="Sound 声音">🔊</button>
      <button id="btn-settings" class="top-btn" aria-label="Settings 设置">⚙️</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="modal-root"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <noscript>
    <div style="padding:2rem;text-align:center;font-size:1.2rem">
      需要启用 JavaScript 才能玩游戏。Please enable JavaScript to play.
    </div>
  </noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
